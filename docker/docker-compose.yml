  heatmap:
    image: ghcr.io/simonwehle/activity-heatmap:latest
    container_name: activity-heatmap
    restart: unless-stopped
    environment:
      MAPLIBRE_STYLE: ${MAPLIBRE_STYLE}
    ports:
      - "3465:3465"
    volumes:
      # mount endurain's synced activities directly into activity heatmap
      - ./data/activity_files/processed:/app/activities:ro
