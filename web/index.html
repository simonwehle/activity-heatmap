<!doctype html>
<html>
  <head>
    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <script src="https://loc8.us/maplibre-gl-vector-text-protocol/dist/maplibre-gl-vector-text-protocol.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.svg?v=2" />
    <title>Activity Heatmap</title>
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const map = new maplibregl.Map({
        container: "map",
        style: "{{.MapStyle}}",
        center: [0, 0],
        zoom: 0,
      });
      map.on("load", async () => {
        try {
          const response = await fetch("/heatmap.json");
          const heatmapStyle = await response.json();

          for (const [sourceId, sourceDef] of Object.entries(
            heatmapStyle.sources || {},
          )) {
            if (!map.getSource(sourceId)) {
              map.addSource(sourceId, sourceDef);
            }
          }
          for (const layer of heatmapStyle.layers || []) {
            if (!map.getLayer(layer.id)) {
              map.addLayer(layer);
            }
          }
        } catch (error) {
          console.error("Error loading heatmap style:", error);
        }
      });
    </script>
  </body>
</html>
