<!doctype html>
<html>
  <head>
    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <script src="https://loc8.us/maplibre-gl-vector-text-protocol/dist/maplibre-gl-vector-text-protocol.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.svg?v=2" />
    <title>Activity Heatmap</title>
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const map = new maplibregl.Map({
        container: "map",
        style: "{{.MapStyle}}",
        center: [10, 50],
        zoom: 6,
      });

      map.on("load", () => {
        map.addSource("tracks-source", {
          type: "raster",
          tiles: ["http://localhost:3465/tiles/{z}/{x}/{y}.png"],
          tileSize: 256,
        });
        map.addLayer({
          id: "tracks-layer",
          type: "raster",
          source: "tracks-source",
          paint: {
            "raster-opacity": 1.0,
          },
        });
      });
    </script>
  </body>
</html>
