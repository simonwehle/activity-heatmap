<!doctype html>
<html>
  <head>
    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <script src="https://loc8.us/maplibre-gl-vector-text-protocol/dist/maplibre-gl-vector-text-protocol.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.svg?v=2" />
    <title>Activity Heatmap</title>
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const map = new maplibregl.Map({
        container: "map",
        style: "{{.MapStyle}}",
        center: [0, 0],
        zoom: 0,
      });
      map.on("load", async () => {
        // Loads a style-shaped response ({ sources: {...}, layers: [...] }),
        // like /heatmap.json.
        async function loadStyleShaped(url) {
          const response = await fetch(url);
          const style = await response.json();

          for (const [sourceId, sourceDef] of Object.entries(
            style.sources || {},
          )) {
            if (!map.getSource(sourceId)) {
              map.addSource(sourceId, sourceDef);
            }
          }
          for (const layer of style.layers || []) {
            if (!map.getLayer(layer.id)) {
              map.addLayer(layer);
            }
          }
        }

        // Loads an overlay-shaped response ({ source: {...}, layers: [...] }),
        // like /api/heatmap-overlay or /api/squadrats-overlay. All layers
        // share the single "source", referenced by sourceId.
        async function loadOverlayShaped(url, sourceId) {
          const response = await fetch(url);
          const body = await response.json();

          if (!map.getSource(sourceId)) {
            map.addSource(sourceId, { type: "geojson", data: body.source });
          }
          for (const layer of body.layers || []) {
            if (!map.getLayer(layer.id)) {
              map.addLayer({ ...layer, source: sourceId });
            }
          }
        }

        try {
          await loadStyleShaped("/heatmap.json");
        } catch (error) {
          console.error("Error loading heatmap style:", error);
        }

        try {
          await loadOverlayShaped("/api/squadrats-overlay", "squadrats-source");
        } catch (error) {
          console.error("Error loading squadrats overlay:", error);
        }
      });
    </script>
  </body>
</html>
